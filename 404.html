<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WAIC 2026 아카이브 이동 안내</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://yoon-open.github.io/waic-2026/">
  <meta http-equiv="refresh" content="0; url=https://yoon-open.github.io/waic-2026/">
</head>
<body>
  <p>WAIC 2026 아카이브가 <a href="https://yoon-open.github.io/waic-2026/">새 주소</a>로 이동했습니다.</p>
  <script>
    const suffix = location.pathname.replace(/^\/waic(?=\/|$)/, "") || "/";
    location.replace("https://yoon-open.github.io/waic-2026" + suffix + location.search + location.hash);
  </script>
</body>
</html>
